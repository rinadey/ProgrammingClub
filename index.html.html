`},roles:[{id:`v1`,role:{en:`Leader`,ar:`القائد (Leader)`},hint:{en:`Tries to control the group, assigns tasks, and wants everyone to follow his plans.`,ar:`يحاول السيطرة على المجموعة، ويوزع المهام، ويريد من الجميع اتباع خططه.`}},{id:`v2`,role:{en:`Dramatic`,ar:`الدرامي (Dramatic)`},hint:{en:`Exaggerates everything: "This is the worst day of my life!"`,ar:`يبالغ في كل شيء: "هذا أسوأ يوم في حياتي!"`}},{id:`v3`,role:{en:`Opponent`,ar:`المعارض (Opponent)`},hint:{en:`Objects to every proposal that is presented.`,ar:`يعترض على كل اقتراح يُقدم.`}},{id:`v4`,role:{en:`Coward`,ar:`الجبان (Coward)`},hint:{en:`Afraid of the forest, animals, and the sea, and refuses any plan, thinks everything is dangerous.`,ar:`يخاف من الغابة والحيوانات والبحر، ويرفض أي خطة ويعتقد أن كل شيء خطير.`}}]},{id:`university-project`,situation:{en:`You have a university project that’s due tomorrow, and you haven’t finished it yet. You need to agree on a plan to save the project.`,ar:`لديكم مشروع جامعي موعد تسليمه غداً، ولم تنتهوا منه بعد! تحتاجون للاتفاق على خطة لإنقاذ المشروع.`},roles:[{id:`v1`,role:{en:`Bossy`,ar:`المتسلط (Bossy)`},hint:{en:`Assigns tasks to everyone without discussion and wants to control every detail.`,ar:`يوزع المهام على الجميع دون نقاش ويريد التحكم في كل تفصيلة.`}},{id:`v2`,role:{en:`Indecisive`,ar:`المتردد (Indecisive)`},hint:{en:`Changes their mind every 30 seconds.`,ar:`يغير رأيه كل ٣٠ ثانية.`}},{id:`v3`,role:{en:`Perfectionist`,ar:`المثالي (Perfectionist)`},hint:{en:`Wants all tasks done perfectly and focuses on every detail.`,ar:`يريد إنجاز جميع المهام بمثالية تامة ويدقق في أدق التفاصيل.`}},{id:`v4`,role:{en:`Lazy`,ar:`الكسول (Lazy)`},hint:{en:`Has a different excuse for every task: the internet went out, the laptop broke, or they were busy.`,ar:`عنده عذر مختلف لكل مهمة: النت مقطوع، اللابتوب خربان، أو كان مشغولاً.`}}]},{id:`hackathon-crisis`,situation:{en:`Your hackathon demo is in 30 minutes, and the main feature just crashed.`,ar:`العرض التقديمي للهاكاثون بعد ٣٠ دقيقة، وا
